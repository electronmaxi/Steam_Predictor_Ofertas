name: Daily Update (juegos activos)

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC todos los días
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas python-dotenv

      - name: Run daily update
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: python collect_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --staged --quiet || git commit -m "Actualiza datos diarios $(date -u +'%Y-%m-%d')"
          git push