name: Onboard New Games (lotes)

on:
  schedule:
    - cron: "0 2,6,10,14,22 * * *"
  workflow_dispatch:

# Mismo grupo que el daily: nunca corren a la vez, así no chocan los push.
concurrency:
  group: steam-data-write
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Igual que el daily: el script para solo, el paso tiene su propio timeout
      # y el commit corre igual para subir lo ya guardado.
      - name: Run onboarding batch
        timeout-minutes: 80
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          MAX_RUNTIME_MIN: "60"
        run: python onboard_batch.py

      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "Onboarding lote $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
