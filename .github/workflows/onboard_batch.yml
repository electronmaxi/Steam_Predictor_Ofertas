name: Onboard New Games (lotes)

on:
  schedule:
    - cron: "0 2,6,10,14,22 * * *"
  workflow_dispatch:

jobs:
  onboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas python-dotenv

      - name: Run onboarding batch
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: python onboard_batch.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --staged --quiet || git commit -m "Onboarding lote $(date -u +'%Y-%m-%d %H:%M')"
          git push