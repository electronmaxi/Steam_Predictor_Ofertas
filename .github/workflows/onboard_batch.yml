name: Onboard New Games (lotes)

on:
  schedule:
    # Cada 3 h fuera de la ventana del daily (15:00 → ~20:30 UTC): el de las 12 termina
    # antes de las 15 y el de las 21 parte cuando el daily ya terminó.
    - cron: "0 21,0,3,6,9,12 * * *"
  workflow_dispatch:

# Mismo grupo que el daily: nunca corren a la vez, así no chocan los push.
concurrency:
  group: steam-data-write
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Igual que el daily: el script para solo, el paso tiene su propio timeout
      # y el commit corre igual para subir lo ya guardado.
      - name: Run onboarding batch
        timeout-minutes: 165
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          PYTHONUNBUFFERED: "1"   # que los print salgan en vivo en el log
          MAX_RUNTIME_MIN: "150"
          BATCH_SIZE: "10000"
        run: python onboard_batch.py

      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "Onboarding lote $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
